[package]
name = "selective"
version = "0.1.0"
edition = "2021"
description = "Interactive single-select filter for the shell"
license = "MIT"

[[bin]]
name = "selective"
path = "src/main.rs"

[lib]
name = "selective"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
libc = "0.2"

[profile.release]
lto = true
strip = true
